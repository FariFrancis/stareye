{% extends "base.html" %}

{% block title %}
Chat with {{ other.user.username }}
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto px-4 py-6">

    <div class="card bg-base-100 shadow-xl">

        <div class="card-body">

            <div class="flex justify-between items-center mb-4">

                <div>

                    <h1 class="text-3xl font-bold">

                        Chat with

                        <a
                            href="{% url 'profile-detail' other.user_id %}"
                            class="link link-info">

                            {{ other.user.username }}

                        </a>

                    </h1>

                    <p
                        id="status"
                        class="text-sm text-base-content/70">

                        Connecting...

                    </p>

                </div>

            </div>

            <!-- Chat Messages -->

            <div
                id="log"
                class="bg-base-200 rounded-xl p-4 h-[500px] overflow-y-auto space-y-3">

            </div>

            <!-- Message Form -->

            <form
                id="chat-form"
                class="flex gap-3 mt-4">

                <input
                    id="msg"
                    type="text"
                    autocomplete="off"
                    required
                    placeholder="Type a message..."
                    class="input input-bordered input-info flex-1">

                <button
                    type="submit"
                    class="btn btn-info">

                    Send

                </button>

            </form>

        </div>

    </div>

</div>

{{ chat_config|json_script:"chat-config" }}

<script>
(function () {

    const cfg = JSON.parse(
        document.getElementById("chat-config").textContent
    );

    const log = document.getElementById("log");
    const status = document.getElementById("status");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("msg");

    input.maxLength = cfg.maxLength;

    function addMessage(sender, text) {

        const wrapper = document.createElement("div");

        wrapper.className =
            "bg-base-100 p-3 rounded-xl shadow";

        const who = document.createElement("div");

        who.className =
            "font-bold text-info mb-1";

        who.textContent = sender;

        const body = document.createElement("div");

        body.textContent = text;

        wrapper.appendChild(who);
        wrapper.appendChild(body);

        log.appendChild(wrapper);

        log.scrollTop = log.scrollHeight;
    }

    fetch(
        cfg.historyUrl,
        {
            credentials: "same-origin"
        }
    )
    .then(function (r) {
        return r.ok
            ? r.json()
            : Promise.reject();
    })
    .then(function (data) {

        data.messages.forEach(function (m) {

            addMessage(
                m.sender,
                m.message
            );

        });

    })
    .catch(function () {

        status.textContent =
            "Could not load earlier messages.";

    });

    const scheme =
        location.protocol === "https:"
            ? "wss"
            : "ws";

    const ws = new WebSocket(
        scheme +
        "://" +
        location.host +
        cfg.wsPath
    );

    ws.onopen = function () {

        status.textContent =
            "Connected";

    };

    ws.onclose = function () {

        status.textContent =
            "Disconnected. Reload to reconnect.";

    };

    ws.onmessage = function (event) {

        const data =
            JSON.parse(event.data);

        if (data.error) {

            status.textContent =
                data.error;

            return;
        }

        addMessage(
            data.sender,
            data.message
        );

    };

    form.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            const text =
                input.value.trim();

            if (
                !text ||
                ws.readyState !== WebSocket.OPEN
            ) {
                return;
            }

            ws.send(
                JSON.stringify({
                    message: text
                })
            );

            input.value = "";
        }
    );

})();
</script>

{% endblock %}
