{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
</form>
<p class="muted">Photos can be added by an admin for now (Admin &rarr; Profiles &rarr; Images).</p>
{% endblock %}
